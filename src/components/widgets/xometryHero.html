<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: -apple-system, 'SF Pro Display', 'Inter', sans-serif;
}

.thumb {
  width: 640px;
  height: 360px;
  background: #0A1628;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
  transition: box-shadow 0.4s ease, transform 0.4s ease;
}
.thumb:hover {
  box-shadow: 0 28px 72px rgba(14,106,237,0.22), 0 6px 20px rgba(0,0,0,0.3);
  transform: translateY(-3px);
}

/* ── GRID TEXTURE ── */
.grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(14,106,237,0.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(14,106,237,0.055) 1px, transparent 1px);
  background-size: 44px 44px;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.thumb:hover .grid { opacity: 1.4; }

/* ── AMBIENT GLOW ── */
.glow {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.glow-a {
  width: 420px; height: 420px;
  background: radial-gradient(circle, rgba(14,106,237,0.2) 0%, transparent 65%);
  top: -100px; left: -60px;
}
.glow-b {
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(14,106,237,0.12) 0%, transparent 65%);
  bottom: -60px; right: 60px;
}
.thumb:hover .glow-a { opacity: 1.3; transform: scale(1.08); }
.thumb:hover .glow-b { opacity: 1.5; transform: scale(1.1); }

/* ── PHONES ── */
.phone {
  position: absolute;
  bottom: 0;
}
.shell {
  border-radius: 36px;
  border: 5px solid rgba(255,255,255,0.13);
  overflow: hidden;
  background: #fff;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.06),
    0 28px 70px rgba(0,0,0,0.55),
    0 8px 20px rgba(0,0,0,0.3);
  transition: box-shadow 0.4s ease, transform 0.4s ease;
}
.shell img { display: block; width: 100%; pointer-events: none; }

/* left phone — job board */
.phone-l {
  left: 160px;
  bottom: 18px;
  transition: transform 0.45s cubic-bezier(0.34,1.4,0.64,1);
}
.phone-l .shell { width: 150px; }
.thumb:hover .phone-l { transform: translateY(-10px); }
.thumb:hover .phone-l .shell {
  box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 36px 80px rgba(0,0,0,0.6), 0 8px 24px rgba(14,106,237,0.2);
}

/* right phone — home/scores, offset down + behind */
.phone-r {
  left: 372px;
  bottom: 22px;
  transition: transform 0.45s cubic-bezier(0.34,1.4,0.64,1) 0.05s;
}
.phone-r .shell { width: 134px; opacity: 0.82; }
.thumb:hover .phone-r { transform: translateY(-7px); }
.thumb:hover .phone-r .shell {
  opacity: 1;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 28px 64px rgba(0,0,0,0.55), 0 6px 18px rgba(14,106,237,0.15);
}

/* ── STAT CHIPS ── */
.stat {
  position: absolute;
  background: rgba(8,16,32,0.92);
  border-radius: 12px;
  padding: 10px 14px;
  backdrop-filter: blur(16px);
  z-index: 20;
  transition: transform 0.4s cubic-bezier(0.34,1.4,0.64,1), box-shadow 0.4s ease, border-color 0.3s ease;
}
.stat-label {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.28);
  margin-bottom: 4px;
}
.stat-value {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
  color: #fff;
}
.stat-sub {
  font-size: 10px;
  color: rgba(255,255,255,0.32);
  margin-top: 3px;
  line-height: 1.4;
}

/* top-left: match score */
.stat-a {
  top: 36px;
  left: 28px;
  border: 1px solid rgba(14,106,237,0.35);
  box-shadow: 0 0 0 1px rgba(14,106,237,0.08), 0 8px 28px rgba(0,0,0,0.5);
}
.thumb:hover .stat-a {
  transform: translateY(-5px) translateX(-2px);
  border-color: rgba(14,106,237,0.55);
  box-shadow: 0 0 0 1px rgba(14,106,237,0.15), 0 14px 40px rgba(0,0,0,0.55), 0 0 20px rgba(14,106,237,0.1);
}

/* bottom-left: job details */
.stat-b {
  bottom: 36px;
  left: 28px;
  border: 1px solid rgba(134,181,248,0.3);
  box-shadow: 0 0 0 1px rgba(134,181,248,0.06), 0 8px 28px rgba(0,0,0,0.5);
}
.thumb:hover .stat-b {
  transform: translateY(4px) translateX(-2px);
  border-color: rgba(134,181,248,0.5);
  box-shadow: 0 0 0 1px rgba(134,181,248,0.12), 0 14px 40px rgba(0,0,0,0.55);
}

/* right: scores */
.stat-c {
  right: 28px;
  top: 50%;
  transform: translateY(-50%);
  border: 1px solid rgba(195,218,251,0.25);
  box-shadow: 0 0 0 1px rgba(195,218,251,0.06), 0 8px 28px rgba(0,0,0,0.5);
  min-width: 140px;
}
.thumb:hover .stat-c {
  transform: translateY(calc(-50% - 5px));
  border-color: rgba(195,218,251,0.45);
  box-shadow: 0 0 0 1px rgba(195,218,251,0.12), 0 14px 40px rgba(0,0,0,0.55);
}

/* score trio inside stat-c */
.score-row {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}
.score-block { text-align: center; }
.score-num {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
  display: block;
}
.score-lbl {
  font-size: 8px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.28);
  margin-top: 2px;
  display: block;
}
.score-sep {
  width: 0.5px;
  background: rgba(255,255,255,0.12);
  align-self: stretch;
  flex-shrink: 0;
}

/* ── SVG CONNECTOR LINES ── */
.svg-lines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  overflow: visible;
}
.conn {
  fill: none;
  stroke-width: 1;
  stroke-dasharray: 3 4;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.thumb:hover .conn { opacity: 1; }
.conn-a { animation: flow 2s linear infinite; }
.conn-b { animation: flow 2s linear 0.3s infinite; }
.conn-c { animation: flow 2s linear 0.6s infinite; }
@keyframes flow { to { stroke-dashoffset: -28; } }

.conn-dot {
  opacity: 0;
  transition: opacity 0.4s ease;
}
.thumb:hover .conn-dot { opacity: 1; }

/* ── EDGE FADE ── */
.fade {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(to right, #0A1628 0%, transparent 18%, transparent 80%, #0A1628 100%),
    linear-gradient(to bottom, #0A1628 0%, transparent 14%, transparent 86%, #0A1628 100%);
  pointer-events: none;
  z-index: 15;
  transition: opacity 0.4s ease;
}
.thumb:hover .fade { opacity: 0.75; }
</style>
</head>
<body>
<div class="thumb">
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="grid"></div>

  <!-- connector SVG -->
  <svg class="svg-lines" width="640" height="360">
    <!-- stat-a → left phone upper area -->
    <path class="conn conn-a" d="M 200 74 Q 218 90 236 104" stroke="rgba(14,106,237,0.5)"/>
    <circle class="conn-dot" cx="236" cy="104" r="3" fill="rgba(14,106,237,0.7)"/>
    <!-- stat-b → left phone lower area -->
    <path class="conn conn-b" d="M 190 290 Q 214 280 238 270" stroke="rgba(134,181,248,0.45)"/>
    <circle class="conn-dot" cx="238" cy="270" r="3" fill="rgba(134,181,248,0.7)"/>
    <!-- stat-c → right phone -->
    <path class="conn conn-c" d="M 470 176 Q 458 164 446 152" stroke="rgba(195,218,251,0.4)"/>
    <circle class="conn-dot" cx="446" cy="152" r="3" fill="rgba(195,218,251,0.7)"/>
  </svg>

  <!-- STAT A: match score -->
  <div class="stat stat-a">
    <div class="stat-label">AI-matched offer</div>
    <div class="stat-value" style="color:#5BA7FF;">88% Match</div>
    <div class="stat-sub">J00CE090 · $388.58<br>CNC · Aluminum 6061-T6</div>
  </div>

  <!-- STAT B: active filters -->
  <div class="stat stat-b">
    <div class="stat-label">Active filters</div>
    <div style="display:flex;flex-direction:column;gap:4px;margin-top:2px;">
      <div style="font-size:11px;color:rgba(255,255,255,0.72);background:rgba(14,106,237,0.15);border:1px solid rgba(14,106,237,0.28);border-radius:20px;padding:3px 9px;white-space:nowrap;">Price &lt; $4.00</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.72);background:rgba(14,106,237,0.15);border:1px solid rgba(14,106,237,0.28);border-radius:20px;padding:3px 9px;white-space:nowrap;">Lead Time: 7 days</div>
    </div>
  </div>

  <!-- STAT C: PSS scores -->
  <div class="stat stat-c">
    <div class="stat-label">Partner Success Score</div>
    <div class="score-row">
      <div class="score-block">
        <span class="score-num" style="color:#E7F1FF;">88</span>
        <span class="score-lbl">Overall</span>
      </div>
      <div class="score-sep"></div>
      <div class="score-block">
        <span class="score-num" style="color:#95DE64;">92</span>
        <span class="score-lbl">Quality</span>
      </div>
      <div class="score-sep"></div>
      <div class="score-block">
        <span class="score-num" style="color:#FF7875;">75</span>
        <span class="score-lbl">Time</span>
      </div>
    </div>
  </div>

  <!-- PHONE LEFT: job board -->
  <div class="phone phone-l">
    <div class="shell">
      <img src="/case-study-1/job-management.png"
           alt="Job board"
           onerror="this.parentElement.style.minHeight='300px';this.parentElement.style.background='#e6f0fd';this.style.display='none'"/>
    </div>
  </div>

  <!-- PHONE RIGHT: home scores -->
  <div class="phone phone-r">
    <div class="shell">
      <img src="/case-study-1/Scores.png"
           alt="Home scores"
           onerror="this.parentElement.style.minHeight='280px';this.parentElement.style.background='#fff';this.style.display='none'"/>
    </div>
  </div>

  <div class="fade"></div>
</div>
</body>
</html>
